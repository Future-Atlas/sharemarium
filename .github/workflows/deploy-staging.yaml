name: Deploy Flutter Web to Vercel (Staging)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Flutter Web (Staging)
        run: flutter build web --release --dart-define=FLUTTER_WEB_RENDERER=html --dart-define=APP_ENV=staging --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=SUPABASE_REDIRECT_URL=${{ secrets.SUPABASE_REDIRECT_URL }} --dart-define=AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}

      - name: Install Vercel CLI
        run: npm install --global vercel@59.18.0

      - name: Verify Vercel Project Access
        run: vercel project inspect "$VERCEL_PROJECT_ID" --non-interactive

      - name: Pull Vercel Environment Information (Preview)
        run: vercel pull --yes --environment=preview

      - name: Verify Flutter build output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          echo "Flutter build output: $(du -sh build/web | cut -f1)"

      - name: Verify Vercel upload manifest
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy . --dry --format=json > /tmp/vercel-deploy-manifest.json
          grep -q 'build/web/flutter_bootstrap.js' /tmp/vercel-deploy-manifest.json
          grep -q 'api/home-ad-eligibility.js' /tmp/vercel-deploy-manifest.json
          echo "Verified Flutter assets and API source are included in the Vercel deployment manifest."

      - name: Deploy to Vercel Preview
        id: deploy_preview
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy . --force)"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Could not determine preview deployment URL: $deployment_url"
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $deployment_url"

      - name: Smoke test staging preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_preview.outputs.url }}
        run: bash scripts/staging-smoke.sh
