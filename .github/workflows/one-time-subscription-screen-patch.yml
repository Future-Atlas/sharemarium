name: One-time subscription status screen patch

on:
  push:
    branches:
      - feat/subscription-status-screen
    paths:
      - .github/workflows/one-time-subscription-screen-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscription-status-screen
          fetch-depth: 0

      - name: Connect plan status screen to account settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/account_settings_screen.dart')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          once(
              "import 'profile_onboarding_screen.dart';\nimport 'terms_screen.dart';\n",
              "import 'profile_onboarding_screen.dart';\nimport 'subscription_status_screen.dart';\nimport 'terms_screen.dart';\n",
              'subscription screen import',
          )

          once(
              "              ],\n            ),\n            const SizedBox(height: 18),\n            const _SectionTitle('各種ポリシー'),\n",
              "              ],\n            ),\n            const SizedBox(height: 18),\n            const _SectionTitle('プラン・契約'),\n            _SettingsCard(\n              children: [\n                ListTile(\n                  leading: const Icon(Icons.workspace_premium_outlined),\n                  title: const Text('プラン・契約'),\n                  subtitle: const Text('現在のプラン・無料体験・次回更新日を確認'),\n                  trailing: const Icon(Icons.chevron_right),\n                  onTap: () => _push(const SubscriptionStatusScreen()),\n                ),\n              ],\n            ),\n            const SizedBox(height: 18),\n            const _SectionTitle('各種ポリシー'),\n",
              'subscription settings section',
          )

          replacements = [
              ('全14色はサブスク特典です。', '全14色はPremium特典です。'),
              ("'${option.label}はサブスク限定'", "'${option.label}はPremium限定'"),
              ('このページカラーはサブスク限定です。', 'このページカラーはPremium限定です。'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'premium wording {old!r}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/account_settings_screen.dart
          git commit -m "feat: expose subscription state in account settings"
          git push origin HEAD:feat/subscription-status-screen
