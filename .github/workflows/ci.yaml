name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep an in-flight build running so a newer run on the same ref does not
  # cancel `flutter build web --release` and report a misleading CI failure.
  cancel-in-progress: false

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Install API dependencies
        run: npm ci

      - name: Test Vercel APIs
        run: npm run test:api

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check billing Edge Functions
        # This repository has package.json, so Deno 2 otherwise defaults to
        # manual node_modules mode. The Edge Functions use npm: imports that
        # are not installed by npm ci; auto mode lets Deno resolve them for
        # this isolated type-check without changing runtime configuration.
        run: deno check --node-modules-dir=auto supabase/functions/delete-account/index.ts supabase/functions/billing-checkout/index.ts supabase/functions/billing-cancel-subscription/index.ts supabase/functions/billing-webhook/index.ts
