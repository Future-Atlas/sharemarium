name: One-time billing schedule transition fix

on:
  push:
    branches:
      - feat/normalized-billing-events
    paths:
      - .github/workflows/one-time-billing-schedule-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/normalized-billing-events
          fetch-depth: 0
      - name: Patch mutually exclusive schedule state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql')
          text = path.read_text(encoding='utf-8')
          pairs = [
              (
                  "               SET scheduled_plan = target_scheduled_plan,\n                   scheduled_plan_effective_at = target_scheduled_effective_at,\n                   billing_provider = event_row.provider,\n",
                  "               SET scheduled_plan = target_scheduled_plan,\n                   scheduled_plan_effective_at = target_scheduled_effective_at,\n                   cancel_at_period_end = false,\n                   billing_provider = event_row.provider,\n",
                  'plan-change clears cancellation',
              ),
              (
                  "               SET cancel_at_period_end = true,\n                   current_period_end = COALESCE(target_period_end, current_period_end),\n                   expires_at = COALESCE(target_period_end, expires_at),\n                   billing_provider = event_row.provider,\n",
                  "               SET cancel_at_period_end = true,\n                   scheduled_plan = NULL,\n                   scheduled_plan_effective_at = NULL,\n                   current_period_end = COALESCE(target_period_end, current_period_end),\n                   expires_at = COALESCE(target_period_end, expires_at),\n                   billing_provider = event_row.provider,\n",
                  'cancellation clears plan change',
              ),
          ]
          for old, new, label in pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql
          git commit -m "fix: keep billing schedule state mutually exclusive"
          git push origin HEAD:feat/normalized-billing-events
