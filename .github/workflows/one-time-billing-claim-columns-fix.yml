name: One-time billing claim column fix

on:
  push:
    branches:
      - feat/normalized-billing-events
    paths:
      - .github/workflows/one-time-billing-claim-columns-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/normalized-billing-events
          fetch-depth: 0
      - name: Repair claim column references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql')
          text = path.read_text(encoding='utf-8')
          start = text.index('CREATE OR REPLACE FUNCTION public.claim_billing_webhook_event(')
          end = text.index('CREATE OR REPLACE FUNCTION public.mark_billing_webhook_event_failed(', start)
          head, claim, tail = text[:start], text[start:end], text[end:]
          replacements = [
              ('        incoming_event_id,\n        event_type,', '        provider_event_id,\n        event_type,'),
              ('        incoming_normalized_type,\n        profile_id,', '        normalized_event_type,\n        profile_id,'),
              ('        incoming_payload_sha256,\n        status,', '        payload_sha256,\n        status,'),
              ('        incoming_provider_created_at,\n        processing_started_at,', '        provider_created_at,\n        processing_started_at,'),
              ('ON CONFLICT (provider, incoming_event_id)', 'ON CONFLICT (provider, provider_event_id)'),
              ('event.incoming_event_id = btrim(incoming_event_id)', 'event.provider_event_id = btrim(incoming_event_id)'),
              ('event_row.incoming_normalized_type', 'event_row.normalized_event_type'),
              ('event_row.incoming_payload_sha256', 'event_row.payload_sha256'),
              ('SET incoming_normalized_type = COALESCE(event.incoming_normalized_type, incoming_normalized_type)', 'SET normalized_event_type = COALESCE(event.normalized_event_type, incoming_normalized_type)'),
              ('incoming_payload_sha256 = COALESCE(event.incoming_payload_sha256, lower(incoming_payload_sha256))', 'payload_sha256 = COALESCE(event.payload_sha256, lower(incoming_payload_sha256))'),
              ('incoming_provider_created_at = COALESCE(event.incoming_provider_created_at, incoming_provider_created_at)', 'provider_created_at = COALESCE(event.provider_created_at, incoming_provider_created_at)'),
          ]
          for old, new in replacements:
              count = claim.count(old)
              if count != 1:
                  raise SystemExit(f'expected one claim match for {old!r}, found {count}')
              claim = claim.replace(old, new, 1)
          path.write_text(head + claim + tail, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql
          git commit -m "fix: repair billing event claim column names"
          git push origin HEAD:feat/normalized-billing-events
