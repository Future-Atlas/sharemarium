name: One-time Stripe checkout URL fix

on:
  push:
    branches:
      - feat/stripe-billing-adapter
    paths:
      - .github/workflows/one-time-stripe-checkout-url-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/stripe-billing-adapter
          fetch-depth: 0
      - name: Remove encoded Checkout Session placeholder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/billing-checkout/index.ts')
          text = path.read_text(encoding='utf-8')
          old = "    successUrl.searchParams.set('billing_checkout', 'success')\n    successUrl.searchParams.set('session_id', '{CHECKOUT_SESSION_ID}')\n"
          new = "    successUrl.searchParams.set('billing_checkout', 'success')\n"
          if text.count(old) != 1:
              raise SystemExit('Checkout success URL marker did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/billing-checkout/index.ts
          git commit -m "fix: keep Stripe Checkout return URL provider-neutral"
          git push origin HEAD:feat/stripe-billing-adapter
