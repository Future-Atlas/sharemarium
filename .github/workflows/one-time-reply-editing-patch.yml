name: One-time reply editing client patch

on:
  push:
    branches:
      - feat/premium-reply-editing
    paths:
      - .github/workflows/one-time-reply-editing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/premium-reply-editing
          fetch-depth: 0

      - name: Apply exact reply editing replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new, label):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match in {path_str}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Reply fetches need updated_at so the UI can show an edited marker.
          replace_once(
              'lib/services/supabase_service.dart',
              "            'id, post_id, profile_id, parent_reply_id, message, has_spoiler, created_at, '\n",
              "            'id, post_id, profile_id, parent_reply_id, message, has_spoiler, created_at, updated_at, '\n",
              'reply updated_at select',
          )

          # Add a single optional refresh callback to PostCard and render the
          # owner-only action menu beside the reply timestamp.
          card = 'lib/widgets/post_card.dart'
          replace_once(
              card,
              "import '../models/profile_page_color.dart';\n",
              "import '../models/profile_page_color.dart';\nimport 'post_reply_owner_actions.dart';\n",
              'post card owner action import',
          )
          replace_once(
              card,
              '  final ValueChanged<String>? onReplyUserTap;\n',
              '  final ValueChanged<String>? onReplyUserTap;\n  final Future<void> Function()? onRepliesChanged;\n',
              'post card callback field',
          )
          replace_once(
              card,
              '    this.onReplyUserTap,\n    this.replies = const [],\n',
              '    this.onReplyUserTap,\n    this.onRepliesChanged,\n    this.replies = const [],\n',
              'post card callback constructor',
          )
          replace_once(
              card,
              "                          Text(\n                            _formatDate(reply.createdAt),\n                            style: TextStyle(\n                              color: tertiaryTextColor,\n                              fontSize: 9,\n                            ),\n                          ),\n                          if (onReply != null) ...[\n",
              "                          Text(\n                            _formatDate(reply.createdAt),\n                            style: TextStyle(\n                              color: tertiaryTextColor,\n                              fontSize: 9,\n                            ),\n                          ),\n                          if (reply.isEdited) ...[\n                            const SizedBox(width: 6),\n                            Text(\n                              '編集済み',\n                              style: TextStyle(\n                                color: tertiaryTextColor,\n                                fontSize: 9,\n                                fontWeight: FontWeight.w600,\n                              ),\n                            ),\n                          ],\n                          if (widget.onRepliesChanged != null) ...[\n                            const SizedBox(width: 2),\n                            PostReplyOwnerActions(\n                              reply: reply,\n                              onChanged: widget.onRepliesChanged!,\n                              iconColor: tertiaryTextColor,\n                            ),\n                          ],\n                          if (onReply != null) ...[\n",
              'reply owner menu insertion',
          )

          # Post detail can refresh its existing load function.
          replace_once(
              'lib/screens/post_detail_screen.dart',
              '                  onReplyUserTap: _openProfile,\n                  onReply: _reply,\n',
              '                  onReplyUserTap: _openProfile,\n                  onRepliesChanged: _load,\n                  onReply: _reply,\n',
              'post detail refresh callback',
          )

          # Main timeline can tolerate the existing full controller refresh for
          # the rare edit/delete action. The book-specific panel already has a
          # focused _load(showLoading:false) path.
          book_list = 'lib/screens/book_list_screen.dart'
          replace_once(
              book_list,
              '              onReplyUserTap: _openUserProfile,\n            );\n',
              '              onReplyUserTap: _openUserProfile,\n              onRepliesChanged: () => _controller.loadData(context),\n            );\n',
              'timeline reply refresh callback',
          )
          replace_once(
              book_list,
              '                            onReplyUserTap: widget.onUserTap,\n                          );\n',
              '                            onReplyUserTap: widget.onUserTap,\n                            onRepliesChanged: () => _load(showLoading: false),\n                          );\n',
              'book panel reply refresh callback',
          )

          # User profile main post list can use its full profile refresh. The
          # nested book-post panel refreshes just its reply map from Supabase.
          profile = 'lib/screens/user_profile_screen.dart'
          replace_once(
              profile,
              '                        onReplyUserTap: widget.onProfileTap,\n                      );\n',
              "                        onReplyUserTap: widget.onProfileTap,\n                        onRepliesChanged: () async {\n                          final service = Provider.of<SupabaseService>(\n                            context,\n                            listen: false,\n                          );\n                          final refreshed = await service.fetchRepliesForPosts(\n                            _posts.map((candidate) => candidate.id).toList(growable: false),\n                          );\n                          if (!mounted) return;\n                          setState(() => _replies = refreshed);\n                        },\n                      );\n",
              'profile book panel reply refresh callback',
          )
          replace_once(
              profile,
              '          onReplyUserTap: _openReplyProfile,\n        );\n',
              '          onReplyUserTap: _openReplyProfile,\n          onRepliesChanged: _loadProfileData,\n        );\n',
              'profile main reply refresh callback',
          )
          PY

      - name: Verify and commit patch
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/one-time-reply-editing-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/supabase_service.dart \
            lib/widgets/post_card.dart \
            lib/screens/post_detail_screen.dart \
            lib/screens/book_list_screen.dart \
            lib/screens/user_profile_screen.dart
          git diff --cached --quiet && { echo "No patch needed"; exit 0; }
          git commit -m "feat: connect Premium reply editing UI"
          git push origin HEAD:feat/premium-reply-editing
