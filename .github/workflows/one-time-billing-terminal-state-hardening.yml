name: One-time billing terminal state hardening

on:
  push:
    branches:
      - feat/normalized-billing-events
    paths:
      - .github/workflows/one-time-billing-terminal-state-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/normalized-billing-events
          fetch-depth: 0

      - name: Protect refund-derived terminal states
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql')
          text = migration.read_text(encoding='utf-8')

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return source.replace(old, new, 1)

          text = once(
              text,
              "    target_status TEXT;\n    event_order_at TIMESTAMP WITH TIME ZONE;\nBEGIN\n    SELECT event.*\n      INTO event_row\n      FROM private.billing_webhook_events AS event\n",
              "    target_status TEXT;\n    event_order_at TIMESTAMP WITH TIME ZONE;\n    succeeded_refund_total BIGINT;\nBEGIN\n    SELECT event.*\n      INTO event_row\n      FROM private.billing_webhook_events AS event\n",
              'charge refund total declaration',
          )

          charge_end = (
              "        RETURNING * INTO charge_row;\n"
              "    END IF;\n\n"
              "    UPDATE private.billing_webhook_events\n"
              "       SET profile_id = COALESCE(profile_id, target_profile_id),\n"
          )
          charge_reconcile = (
              "        RETURNING * INTO charge_row;\n"
              "    END IF;\n\n"
              "    SELECT COALESCE(sum(refund.amount_minor), 0)\n"
              "      INTO succeeded_refund_total\n"
              "      FROM private.billing_refunds AS refund\n"
              "     WHERE refund.charge_id = charge_row.id\n"
              "       AND refund.status = 'succeeded';\n\n"
              "    IF succeeded_refund_total > 0 THEN\n"
              "        UPDATE private.billing_charges AS charge\n"
              "           SET status = CASE\n"
              "                WHEN succeeded_refund_total >= charge.amount_minor THEN 'refunded'\n"
              "                ELSE 'partially_refunded'\n"
              "           END\n"
              "         WHERE charge.id = charge_row.id\n"
              "         RETURNING charge.* INTO charge_row;\n"
              "    END IF;\n\n"
              "    UPDATE private.billing_webhook_events\n"
              "       SET profile_id = COALESCE(profile_id, target_profile_id),\n"
          )
          text = once(text, charge_end, charge_reconcile, 'charge refund reconciliation')

          refund_identity = (
              "        IF refund_row.charge_id <> charge_row.id\n"
              "           OR refund_row.amount_minor <> target_amount_minor\n"
              "           OR refund_row.currency <> upper(target_currency) THEN\n"
              "            RAISE EXCEPTION 'billing_refund_identity_mismatch' USING ERRCODE = 'P0001';\n"
              "        END IF;\n"
              "        UPDATE private.billing_refunds AS refund\n"
          )
          refund_terminal = (
              "        IF refund_row.charge_id <> charge_row.id\n"
              "           OR refund_row.amount_minor <> target_amount_minor\n"
              "           OR refund_row.currency <> upper(target_currency) THEN\n"
              "            RAISE EXCEPTION 'billing_refund_identity_mismatch' USING ERRCODE = 'P0001';\n"
              "        END IF;\n"
              "        IF refund_row.status = 'succeeded' AND target_status <> 'succeeded' THEN\n"
              "            UPDATE private.billing_webhook_events\n"
              "               SET status = 'ignored',\n"
              "                   processed_at = timezone('utc'::text, now()),\n"
              "                   last_error = NULL,\n"
              "                   processing_note = 'terminal_refund_state'\n"
              "             WHERE id = webhook_event_id;\n"
              "            RETURN refund_row.id;\n"
              "        END IF;\n"
              "        UPDATE private.billing_refunds AS refund\n"
          )
          text = once(text, refund_identity, refund_terminal, 'refund terminal state guard')
          text = once(
              text,
              "                    WHEN target_status = 'succeeded'\n                        THEN COALESCE(target_completed_at, refund.completed_at, timezone('utc'::text, now()))\n",
              "                    WHEN target_status = 'succeeded'\n                        THEN COALESCE(refund.completed_at, target_completed_at, timezone('utc'::text, now()))\n",
              'refund completion timestamp immutability',
          )
          migration.write_text(text, encoding='utf-8')

          test_file = Path('supabase/tests/normalized_billing_event_processing_test.sql')
          tests = test_file.read_text(encoding='utf-8')
          tests = once(
              tests,
              "    null, '2030-02-02 00:00:00+00'::timestamptz,\n    null, null, '2030-01-10 00:00:00+00'::timestamptz, 'cus_1'\n",
              "    null, '2030-02-02 00:00:00+00'::timestamptz,\n    null, null, null, 'cus_1'\n",
              'payment failure lets DB derive grace deadline',
          )
          tests = once(
              tests,
              "  'payment failure stores one-week grace deadline supplied by adapter'\n",
              "  'payment failure enforces the one-week grace deadline in the database'\n",
              'payment grace test label',
          )

          insertion = (
              "\n\n-- Succeeded refunds are terminal, even if a newer failure event arrives.\n"
              "select * from public.claim_billing_webhook_event(\n"
              "  'testpay', 'evt_refund_new_failed', 'refund.failed', 'refund.failed',\n"
              "  '79000000-0000-4000-8000-000000000001'::uuid,\n"
              "  repeat('ab', 32), '2030-01-17 00:00:00+00'::timestamptz\n"
              ");\n"
              "select isnt(\n"
              "  public.apply_normalized_refund_event(\n"
              "    (select id from private.billing_webhook_events where provider_event_id = 'evt_refund_new_failed'),\n"
              "    'ch_1', 'ref_2', 350, 'JPY', 'other', 'late provider failure', null\n"
              "  ),\n"
              "  null::uuid,\n"
              "  'newer failed event returns the existing succeeded refund id'\n"
              ");\n"
              "select is(\n"
              "  (select status from private.billing_refunds where provider = 'testpay' and provider_refund_id = 'ref_2'),\n"
              "  'succeeded',\n"
              "  'succeeded refund remains terminal after a newer failed event'\n"
              ");\n"
              "select is(\n"
              "  (select status from private.billing_webhook_events where provider_event_id = 'evt_refund_new_failed'),\n"
              "  'ignored',\n"
              "  'newer non-success event for a succeeded refund is audited as ignored'\n"
              ");\n"
              "select is(\n"
              "  (select processing_note from private.billing_webhook_events where provider_event_id = 'evt_refund_new_failed'),\n"
              "  'terminal_refund_state',\n"
              "  'terminal refund ignore reason is explicit'\n"
              ");\n\n"
              "-- A later charge event cannot erase refund-derived charge state.\n"
              "select * from public.claim_billing_webhook_event(\n"
              "  'testpay', 'evt_charge_after_refund', 'charge.succeeded', 'charge.paid',\n"
              "  '79000000-0000-4000-8000-000000000001'::uuid,\n"
              "  repeat('bc', 32), '2030-01-18 00:00:00+00'::timestamptz\n"
              ");\n"
              "select isnt(\n"
              "  public.apply_normalized_charge_event(\n"
              "    (select id from private.billing_webhook_events where provider_event_id = 'evt_charge_after_refund'),\n"
              "    '79000000-0000-4000-8000-000000000001'::uuid,\n"
              "    'premium', 'monthly', 550, 'JPY', 'ch_1', 'cus_1', 'inv_1',\n"
              "    '2030-01-11 00:00:00+00'::timestamptz,\n"
              "    '2030-01-10 00:00:00+00'::timestamptz, '2030-02-10 00:00:00+00'::timestamptz\n"
              "  ),\n"
              "  null::uuid,\n"
              "  'later paid charge event is accepted without losing refund reconciliation'\n"
              ");\n"
              "select is(\n"
              "  (select status from private.billing_charges where provider = 'testpay' and provider_charge_id = 'ch_1'),\n"
              "  'refunded',\n"
              "  'fully refunded charge remains refunded after a later paid event'\n"
              ");\n"
          )
          marker = "\nreset role;\nselect * from finish();\nrollback;"
          if tests.count(marker) != 1:
              raise SystemExit('test finish marker did not match exactly once')
          tests = tests.replace(marker, insertion + marker, 1)
          test_file.write_text(tests, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql \
            supabase/tests/normalized_billing_event_processing_test.sql
          git commit -m "fix: preserve billing terminal states"
          git push origin HEAD:feat/normalized-billing-events
