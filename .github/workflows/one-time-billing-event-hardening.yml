name: One-time billing event hardening

on:
  push:
    branches:
      - feat/normalized-billing-events
    paths:
      - .github/workflows/one-time-billing-event-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/normalized-billing-events
          fetch-depth: 0

      - name: Harden migration before validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          once(
              "ALTER TABLE private.subscription_entitlements\n    ADD COLUMN IF NOT EXISTS last_billing_event_id UUID\n        REFERENCES private.billing_webhook_events(id) ON DELETE SET NULL,\n    ADD COLUMN IF NOT EXISTS last_billing_event_order_at TIMESTAMP WITH TIME ZONE;\n",
              "ALTER TABLE private.subscription_entitlements\n    ADD COLUMN IF NOT EXISTS last_billing_event_id UUID\n        REFERENCES private.billing_webhook_events(id) ON DELETE SET NULL,\n    ADD COLUMN IF NOT EXISTS last_billing_event_order_at TIMESTAMP WITH TIME ZONE;\n\nALTER TABLE private.billing_charges\n    ADD COLUMN IF NOT EXISTS last_billing_event_order_at TIMESTAMP WITH TIME ZONE;\nALTER TABLE private.billing_refunds\n    ADD COLUMN IF NOT EXISTS last_billing_event_order_at TIMESTAMP WITH TIME ZONE;\n",
              'audit ordering columns',
          )

          start = text.index('CREATE OR REPLACE FUNCTION public.claim_billing_webhook_event(')
          end = text.index('\nCREATE OR REPLACE FUNCTION public.mark_billing_webhook_event_failed(', start)
          claim = text[start:end]
          replacements = {
              'billing_provider': 'incoming_provider',
              'provider_event_id': 'incoming_event_id',
              'provider_event_type': 'incoming_event_type',
              'normalized_event_type': 'incoming_normalized_type',
              'target_profile_id': 'incoming_profile_id',
              'payload_sha256': 'incoming_payload_sha256',
              'provider_created_at': 'incoming_provider_created_at',
          }
          for old, new in replacements.items():
              claim = claim.replace(old, new)
          text = text[:start] + claim + text[end:]

          once(
              "    charge_row private.billing_charges%ROWTYPE;\n    target_status TEXT;\nBEGIN\n",
              "    charge_row private.billing_charges%ROWTYPE;\n    target_status TEXT;\n    event_order_at TIMESTAMP WITH TIME ZONE;\nBEGIN\n",
              'charge event order declaration',
          )
          once(
              "    IF target_status IS NULL THEN\n        RAISE EXCEPTION 'unsupported_normalized_charge_event' USING ERRCODE = '22023';\n    END IF;\n\n    SELECT charge.*\n",
              "    IF target_status IS NULL THEN\n        RAISE EXCEPTION 'unsupported_normalized_charge_event' USING ERRCODE = '22023';\n    END IF;\n    event_order_at := COALESCE(event_row.provider_created_at, event_row.received_at);\n\n    SELECT charge.*\n",
              'charge event order assignment',
          )
          once(
              "    IF FOUND THEN\n        IF charge_row.profile_id IS NOT NULL AND charge_row.profile_id <> target_profile_id THEN\n",
              "    IF FOUND THEN\n        IF charge_row.last_billing_event_order_at IS NOT NULL\n           AND event_order_at < charge_row.last_billing_event_order_at THEN\n            UPDATE private.billing_webhook_events\n               SET status = 'ignored',\n                   processed_at = timezone('utc'::text, now()),\n                   last_error = NULL,\n                   processing_note = 'out_of_order_charge_event'\n             WHERE id = webhook_event_id;\n            RETURN charge_row.id;\n        END IF;\n        IF charge_row.profile_id IS NOT NULL AND charge_row.profile_id <> target_profile_id THEN\n",
              'charge stale event guard',
          )
          once(
              "               period_start = COALESCE(target_period_start, charge.period_start),\n               period_end = COALESCE(target_period_end, charge.period_end)\n",
              "               period_start = COALESCE(target_period_start, charge.period_start),\n               period_end = COALESCE(target_period_end, charge.period_end),\n               last_billing_event_order_at = event_order_at\n",
              'charge update event order',
          )
          once(
              "            charged_at,\n            period_start,\n            period_end\n        )\n",
              "            charged_at,\n            period_start,\n            period_end,\n            last_billing_event_order_at\n        )\n",
              'charge insert column',
          )
          once(
              "            target_charged_at,\n            target_period_start,\n            target_period_end\n        )\n",
              "            target_charged_at,\n            target_period_start,\n            target_period_end,\n            event_order_at\n        )\n",
              'charge insert value',
          )

          once(
              "    target_status TEXT;\n    succeeded_total BIGINT;\nBEGIN\n",
              "    target_status TEXT;\n    succeeded_total BIGINT;\n    event_order_at TIMESTAMP WITH TIME ZONE;\nBEGIN\n",
              'refund event order declaration',
          )
          once(
              "    IF target_status IS NULL THEN\n        RAISE EXCEPTION 'unsupported_normalized_refund_event' USING ERRCODE = '22023';\n    END IF;\n\n    SELECT charge.*\n",
              "    IF target_status IS NULL THEN\n        RAISE EXCEPTION 'unsupported_normalized_refund_event' USING ERRCODE = '22023';\n    END IF;\n    event_order_at := COALESCE(event_row.provider_created_at, event_row.received_at);\n\n    SELECT charge.*\n",
              'refund event order assignment',
          )
          once(
              "    IF FOUND THEN\n        IF refund_row.charge_id <> charge_row.id\n",
              "    IF FOUND THEN\n        IF refund_row.last_billing_event_order_at IS NOT NULL\n           AND event_order_at < refund_row.last_billing_event_order_at THEN\n            UPDATE private.billing_webhook_events\n               SET status = 'ignored',\n                   processed_at = timezone('utc'::text, now()),\n                   last_error = NULL,\n                   processing_note = 'out_of_order_refund_event'\n             WHERE id = webhook_event_id;\n            RETURN refund_row.id;\n        END IF;\n        IF refund_row.charge_id <> charge_row.id\n",
              'refund stale event guard',
          )
          once(
              "               completed_at = CASE\n                    WHEN target_status = 'succeeded'\n                        THEN COALESCE(target_completed_at, refund.completed_at, timezone('utc'::text, now()))\n                    ELSE target_completed_at\n               END\n",
              "               completed_at = CASE\n                    WHEN target_status = 'succeeded'\n                        THEN COALESCE(target_completed_at, refund.completed_at, timezone('utc'::text, now()))\n                    ELSE target_completed_at\n               END,\n               last_billing_event_order_at = event_order_at\n",
              'refund update event order',
          )
          once(
              "            status,\n            completed_at\n        )\n",
              "            status,\n            completed_at,\n            last_billing_event_order_at\n        )\n",
              'refund insert column',
          )
          once(
              "            CASE\n                WHEN target_status = 'succeeded'\n                    THEN COALESCE(target_completed_at, timezone('utc'::text, now()))\n                ELSE target_completed_at\n            END\n        )\n",
              "            CASE\n                WHEN target_status = 'succeeded'\n                    THEN COALESCE(target_completed_at, timezone('utc'::text, now()))\n                ELSE target_completed_at\n            END,\n            event_order_at\n        )\n",
              'refund insert value',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql
          git diff --cached --quiet && { echo "No patch needed"; exit 0; }
          git commit -m "fix: harden billing event ordering"
          git push origin HEAD:feat/normalized-billing-events
