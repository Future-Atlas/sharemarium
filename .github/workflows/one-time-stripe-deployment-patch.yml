name: One-time Stripe billing deployment patch

on:
  push:
    branches:
      - feat/stripe-billing-adapter
    paths:
      - .github/workflows/one-time-stripe-deployment-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/stripe-billing-adapter
          fetch-depth: 0

      - name: Update non-workflow Supabase deployment files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new, label):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path_str}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/deploy-staging-db.mjs',
              "export const FUNCTIONS = ['session-guard', 'delete-account', 'admin-delete-account'];",
              "export const FUNCTIONS = ['session-guard', 'delete-account', 'admin-delete-account', 'billing-checkout', 'billing-webhook'];",
              'staging function allowlist',
          )

          config = Path('supabase/config.toml')
          text = config.read_text(encoding='utf-8')
          marker = '[functions.admin-delete-account]\nverify_jwt = true\n'
          addition = (
              '[functions.admin-delete-account]\nverify_jwt = true\n\n'
              '[functions.billing-checkout]\nverify_jwt = true\n\n'
              '# Stripe cannot send a Supabase JWT. This endpoint verifies the raw-body\n'
              '# Stripe-Signature HMAC before parsing or touching the database.\n'
              '[functions.billing-webhook]\nverify_jwt = false\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Supabase function config marker did not match exactly once')
          config.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          replace_once(
              'test/deployment/staging-db.test.mjs',
              "test('apply previews first and deploys only the three approved staging functions', () => {",
              "test('apply previews first and deploys only the approved staging functions', () => {",
              'deployment test wording',
          )
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/deploy-staging-db.mjs \
            supabase/config.toml \
            test/deployment/staging-db.test.mjs
          git commit -m "ci: register Stripe billing edge functions"
          git push origin HEAD:feat/stripe-billing-adapter
