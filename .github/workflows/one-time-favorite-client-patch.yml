name: One-time favorite client patch

on:
  push:
    branches:
      - feat/favorite-retention-downgrade
    paths:
      - .github/workflows/one-time-favorite-client-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/favorite-retention-downgrade
          fetch-depth: 0

      - name: Apply exact favorite client replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str, label: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected exactly one match in {path_str}, found {count}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          service = 'lib/services/supabase_service.dart'
          replace_once(
              service,
              '  static const int subscriberFavoriteLimit = 12;\n',
              '  static const int subscriberFavoriteLimit = 12;\n'
              '  static const int premiumFavoriteLimit = 2147483647;\n',
              'favorite constants',
          )

          replace_once(
              service,
              "            .order('created_at', ascending: false)\n"
              "            .limit(12);\n",
              "            .order('created_at', ascending: false);\n",
              'favorite fetch limit',
          )

          replace_once(
              service,
              '          favoriteLimit = await fetchCurrentFavoriteLimit();\n'
              '          final existingFavorites = await _client!\n'
              "              .from('favorites')\n"
              "              .select('book_id')\n"
              "              .eq('profile_id', profileId)\n"
              '              .limit(favoriteLimit);\n'
              '          if ((existingFavorites as List<dynamic>).length >= favoriteLimit) {\n'
              '            return favoriteLimit == subscriberFavoriteLimit\n'
              '                ? FavoriteToggleResult.subscriberLimitReached\n'
              '                : FavoriteToggleResult.standardLimitReached;\n'
              '          }\n',
              '          favoriteLimit = await fetchCurrentFavoriteLimit();\n'
              '          if (favoriteLimit < premiumFavoriteLimit) {\n'
              '            final existingFavorites = await _client!\n'
              "                .from('favorites')\n"
              "                .select('book_id')\n"
              "                .eq('profile_id', profileId)\n"
              '                .limit(favoriteLimit);\n'
              '            if ((existingFavorites as List<dynamic>).length >= favoriteLimit) {\n'
              '              return favoriteLimit == subscriberFavoriteLimit\n'
              '                  ? FavoriteToggleResult.subscriberLimitReached\n'
              '                  : FavoriteToggleResult.standardLimitReached;\n'
              '            }\n'
              '          }\n',
              'favorite finite precheck',
          )

          replace_once(
              service,
              '      return parsed == subscriberFavoriteLimit\n'
              '          ? subscriberFavoriteLimit\n'
              '          : standardFavoriteLimit;\n',
              '      if (parsed == premiumFavoriteLimit) return premiumFavoriteLimit;\n'
              '      if (parsed == subscriberFavoriteLimit) return subscriberFavoriteLimit;\n'
              '      return standardFavoriteLimit;\n',
              'favorite limit mapping',
          )

          profile = 'lib/screens/user_profile_screen.dart'
          replace_once(
              profile,
              '    if (result == FavoriteToggleResult.standardLimitReached) {\n',
              '    if (result == FavoriteToggleResult.standardLimitReached ||\n'
              '        result == FavoriteToggleResult.subscriberLimitReached) {\n',
              'profile replacement routing',
          )
          replace_once(
              profile,
              "            _isOwnProfile\n"
              "                ? '${_favorites.length}冊/$_favoriteLimit冊'\n"
              "                : '${_favorites.length}冊',\n",
              "            _isOwnProfile\n"
              "                ? _favoriteLimit >= SupabaseService.premiumFavoriteLimit\n"
              "                      ? '${_favorites.length}冊/無制限'\n"
              "                      : '${_favorites.length}冊/$_favoriteLimit冊'\n"
              "                : '${_favorites.length}冊',\n",
              'profile unlimited label',
          )

          book_list = 'lib/screens/book_list_screen.dart'
          replace_once(
              book_list,
              '    if (result == FavoriteToggleResult.standardLimitReached) {\n',
              '    if (result == FavoriteToggleResult.standardLimitReached ||\n'
              '        result == FavoriteToggleResult.subscriberLimitReached) {\n',
              'timeline replacement routing',
          )
          PY

      - name: Verify and commit patch
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/one-time-favorite-client-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/supabase_service.dart lib/screens/user_profile_screen.dart lib/screens/book_list_screen.dart
          git diff --cached --quiet && { echo "No patch needed"; exit 0; }
          git commit -m "fix: make favorite client plan-aware"
          git push origin HEAD:feat/favorite-retention-downgrade
