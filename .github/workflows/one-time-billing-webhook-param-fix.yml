name: One-time billing webhook parameter fix

on:
  push:
    branches:
      - feat/normalized-billing-events
    paths:
      - .github/workflows/one-time-billing-webhook-param-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/normalized-billing-events
          fetch-depth: 0

      - name: Disambiguate charge and refund webhook parameters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql')
          text = path.read_text(encoding='utf-8')

          def replace_exact(source, old, new, expected, label):
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} match(es), found {count}')
              return source.replace(old, new)

          charge_start = text.index('CREATE OR REPLACE FUNCTION public.apply_normalized_charge_event(')
          refund_start = text.index('CREATE OR REPLACE FUNCTION public.apply_normalized_refund_event(', charge_start)
          grants_start = text.index('REVOKE ALL ON FUNCTION public.claim_billing_webhook_event(', refund_start)

          charge = text[charge_start:refund_start]
          charge = replace_exact(charge, '    webhook_event_id UUID,\n', '    input_webhook_event_id UUID,\n', 1, 'charge parameter')
          charge = replace_exact(charge, 'WHERE event.id = webhook_event_id', 'WHERE event.id = input_webhook_event_id', 1, 'charge event lookup')
          charge = replace_exact(charge, 'WHERE charge.webhook_event_id = webhook_event_id', 'WHERE charge.webhook_event_id = input_webhook_event_id', 1, 'charge duplicate lookup')
          charge = replace_exact(charge, 'webhook_event_id = webhook_event_id,', 'webhook_event_id = input_webhook_event_id,', 1, 'charge update assignment')
          charge = replace_exact(
              charge,
              '            target_profile_id,\n            webhook_event_id,\n            event_row.provider,',
              '            target_profile_id,\n            input_webhook_event_id,\n            event_row.provider,',
              1,
              'charge insert value',
          )
          charge = replace_exact(charge, 'WHERE id = webhook_event_id;', 'WHERE id = input_webhook_event_id;', 2, 'charge event status updates')

          refund = text[refund_start:grants_start]
          refund = replace_exact(refund, '    webhook_event_id UUID,\n', '    input_webhook_event_id UUID,\n', 1, 'refund parameter')
          refund = replace_exact(refund, 'WHERE event.id = webhook_event_id', 'WHERE event.id = input_webhook_event_id', 1, 'refund event lookup')
          refund = replace_exact(refund, 'WHERE refund.webhook_event_id = webhook_event_id', 'WHERE refund.webhook_event_id = input_webhook_event_id', 1, 'refund duplicate lookup')
          refund = replace_exact(refund, 'webhook_event_id = webhook_event_id,', 'webhook_event_id = input_webhook_event_id,', 1, 'refund update assignment')
          refund = replace_exact(
              refund,
              '            charge_row.id,\n            webhook_event_id,\n            event_row.provider,',
              '            charge_row.id,\n            input_webhook_event_id,\n            event_row.provider,',
              1,
              'refund insert value',
          )
          refund = replace_exact(refund, 'WHERE id = webhook_event_id;', 'WHERE id = input_webhook_event_id;', 3, 'refund event status updates')

          path.write_text(text[:charge_start] + charge + refund + text[grants_start:], encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260917113000_add_normalized_billing_event_processing.sql
          git commit -m "fix: disambiguate billing webhook parameters"
          git push origin HEAD:feat/normalized-billing-events
