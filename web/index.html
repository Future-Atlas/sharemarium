    <script>
      (() => {
        const allowedPath = /^\/$/;
        const adClient = "ca-pub-3052085512168272";
        const adScriptUrl =
          "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" +
          adClient;

        let adScriptLoaded = false;
        let entitlementState = "unknown";
        let entitlementToken = "";
        let entitlementRequest = null;

        function normalizedPath() {
          return (window.location.pathname || "/").replace(/\/+$/, "") || "/";
        }

        function isAdsRouteAllowed() {
          return allowedPath.test(normalizedPath());
        }

        function currentSupabaseAccessToken() {
          try {
            for (let i = 0; i < window.localStorage.length; i += 1) {
              const key = window.localStorage.key(i) || "";
              if (!key.startsWith("sb-") || !key.endsWith("-auth-token")) continue;
              const raw = window.localStorage.getItem(key);
              if (!raw) continue;
              const parsed = JSON.parse(raw);
              const token = parsed?.access_token || parsed?.currentSession?.access_token;
              if (typeof token === "string" && token.length > 0) return token;
            }
          } catch (_) {
            return "";
          }
          return "";
        }

        function refreshAdEntitlement() {
          const token = currentSupabaseAccessToken();
          if (!token) {
            entitlementToken = "";
            entitlementState = "ads_allowed";
            entitlementRequest = null;
            return Promise.resolve();
          }
          if (token === entitlementToken && entitlementState !== "unknown") {
            return entitlementRequest || Promise.resolve();
          }

          entitlementToken = token;
          entitlementState = "unknown";
          entitlementRequest = fetch("/api/ad-entitlement", {
            method: "GET",
            headers: { Authorization: `Bearer ${token}` },
            cache: "no-store",
          })
            .then((response) => {
              if (!response.ok) throw new Error("entitlement_lookup_failed");
              return response.json();
            })
            .then((body) => {
              entitlementState = body?.adFree === true ? "ad_free" : "ads_allowed";
            })
            .catch(() => {
              // Authenticated users fail closed: if entitlement cannot be
              // verified, do not risk showing ads to a paid subscriber.
              entitlementState = "ad_free";
            })
            .finally(() => {
              entitlementRequest = null;
              scheduleAdCheck();
            });
          return entitlementRequest;
        }

        function hasMeaningfulContent() {
          if (!document.body) return false;
          const text = (document.body.innerText || document.body.textContent || "")
            .replace(/\s+/g, " ")
            .trim();
          if (text.length < 120) return false;
          return /(Sharemarium|おすすめの本|洋書|人気作品)/.test(text);
        }

        function shouldLoadAds() {
          const accessToken = currentSupabaseAccessToken();
          if (accessToken && entitlementState !== "ads_allowed") return false;
          return (
            isAdsRouteAllowed() &&
            hasMeaningfulContent() &&
            window.__sharemariumAdsAllowed !== false
          );
        }

        function reloadIfAdsAreNoLongerAllowed() {
          if (!adScriptLoaded) return false;
          if (isAdsRouteAllowed() && entitlementState !== "ad_free") return false;
          window.location.replace(window.location.href);
          return true;
        }

        function loadAdsIfAllowed() {
          if (!shouldLoadAds() || adScriptLoaded) {
            return;
          }

          adScriptLoaded = true;
          const script = document.createElement("script");
          script.async = true;
          script.src = adScriptUrl;
          script.crossOrigin = "anonymous";
          script.dataset.adsense = "1";
          document.head.appendChild(script);
          return true;
        }

        let adCheckTimer = 0;
        let contentObserver = null;

        function scheduleAdCheck() {
          if (adCheckTimer) {
            window.clearTimeout(adCheckTimer);
          }
          adCheckTimer = window.setTimeout(() => {
            adCheckTimer = 0;
            void refreshAdEntitlement();
            if (reloadIfAdsAreNoLongerAllowed()) return;
            if (loadAdsIfAllowed() && contentObserver) {
              contentObserver.disconnect();
              contentObserver = null;
            }
          }, 0);
        }

        function observeFlutterContent() {
          if (!document.body || contentObserver) return;
          contentObserver = new MutationObserver(scheduleAdCheck);
          contentObserver.observe(document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        }

        function checkAfterDomReady() {
          observeFlutterContent();
          void refreshAdEntitlement();
          scheduleAdCheck();
          window.setTimeout(scheduleAdCheck, 1000);
          window.setTimeout(scheduleAdCheck, 3000);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", checkAfterDomReady, {
            once: true,
          });
        } else {
          checkAfterDomReady();
        }

        window.addEventListener("load", scheduleAdCheck, { passive: true });
        window.addEventListener("pageshow", scheduleAdCheck, { passive: true });
        window.addEventListener("popstate", scheduleAdCheck, { passive: true });
        window.addEventListener("storage", scheduleAdCheck, { passive: true });

        const originalPushState = window.history.pushState;
        const originalReplaceState = window.history.replaceState;

        window.history.pushState = function (...args) {
          const result = originalPushState.apply(this, args);
          scheduleAdCheck();
          return result;
        };

        window.history.replaceState = function (...args) {
          const result = originalReplaceState.apply(this, args);
          scheduleAdCheck();
          return result;
        };
      })();
    </script>
